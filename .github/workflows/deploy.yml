name: Deploy

# Deploy is a separate workflow on purpose: it consumes the `dist` artifact
# produced by a CI run, so a deploy-only fix can be re-run (or an older build
# re-deployed) without repeating the CI pipeline.
on:
  # Automatically deploy every successful CI run on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Deploy an existing CI run by id; empty picks the latest successful one.
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id whose `dist` artifact to deploy (empty = latest successful run on main)
        required: false
        type: string

permissions:
  contents: read
  actions: read # required to download artifacts from another run

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://moon-dev.seatide.net
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve CI run to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-${TRIGGER_RUN_ID:-}}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow ci.yml --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful CI run on main to deploy"
            exit 1
          fi
          echo "Deploying artifacts from CI run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # One-time setup outside this workflow: create the API token with
      # `Workers Scripts: Edit` (the Worker itself is created by the first
      # deploy), add it as CLOUDFLARE_API_TOKEN plus CLOUDFLARE_ACCOUNT_ID to
      # the repository secrets, and attach the custom domain
      # moon-dev.seatide.net in Workers & Pages -> moon-dev -> Settings ->
      # Domains & Routes.
      #
      # `wrangler deploy` reads wrangler.jsonc: an assets-only Worker serving
      # dist/ with SPA fallback, no script entry point.
      #
      # wrangler-action@v3 installs Wrangler 3 by default, which requires a
      # `main` entry point and cannot deploy an assets-only Worker. Wrangler 4
      # serves `wrangler.jsonc`'s assets directory with no script, so pin it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.163.0"
          command: deploy